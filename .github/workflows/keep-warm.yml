name: Keep Render awake

# Render's free tier puts the backend to sleep after 15 minutes of no traffic,
# and the next request then takes 30-50s to wake it (why the Telegram bot felt
# slow). Check database health too so the Supabase project receives activity
# and a database outage fails the workflow instead of silently passing.
#
# This repo is public, so GitHub Actions minutes are free and unlimited.
# Note: GitHub's scheduled runs are best-effort and can be delayed a few minutes
# under load, which is why we ping every 5 minutes (well under the 15-min window).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check backend and database health
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 120 \
            https://expense-iq-ypan.onrender.com/health/detailed \
            --output health.json
          jq --exit-status '.status == "ok" and .database == "connected"' health.json
